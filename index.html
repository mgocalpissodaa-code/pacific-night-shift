<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>パシフィック 夜勤希望</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f5f7fb;color:#1f2937}
.app{max-width:760px;margin:auto;padding:18px 12px 40px}.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 3px 16px #0000000f;margin-bottom:14px}
h1{font-size:24px;margin:0 0 6px}.sub{font-size:14px;color:#64748b;line-height:1.55}label{display:block;font-weight:800;margin:0 0 8px}
select{width:100%;padding:14px;font-size:17px;border:1px solid #cbd5e1;border-radius:12px;background:#fff}.field{margin-top:14px}
.month-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}.month-title{font-size:24px;font-weight:800;text-align:center;flex:1}.nav-btn{border:0;background:#eef2ff;color:#2563eb;border-radius:12px;width:48px;height:48px;font-size:25px;font-weight:bold}
.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekday{text-align:center;font-size:13px;font-weight:700;color:#64748b;padding-bottom:5px}.sun{color:#ef4444}.sat{color:#3b82f6}
.day{min-height:108px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;padding:7px 5px;overflow:hidden;cursor:pointer}.day.empty{visibility:hidden}.day.past{opacity:.42;cursor:default}.day.selected{border:2px solid #2563eb;background:#eff6ff}.day.has{background:#fff7ed}
.date-num{font-size:18px;font-weight:800;margin-bottom:5px}.holiday-date,.sun-date{color:#ef4444}.sat-date{color:#3b82f6}.count{font-size:11px;font-weight:800;border-radius:7px;padding:4px 2px;text-align:center;margin-bottom:4px;background:#ffedd5;color:#9a3412}
.person{font-size:11px;font-weight:700;padding:4px 3px;border-radius:7px;background:#e0f2fe;text-align:center;margin-top:3px;line-height:1.25}.person small{display:block;font-size:9px;color:#475569}.mark{text-align:center;margin-top:4px;font-size:10px;color:#2563eb;font-weight:800}
.actions{position:sticky;bottom:10px;z-index:20;background:#fffffff7;border-radius:18px;padding:12px;box-shadow:0 4px 25px #00000021}.selected-info{text-align:center;font-size:14px;margin-bottom:9px;color:#475569;font-weight:700}
.register,.cancel{width:100%;padding:15px;border:0;border-radius:13px;font-size:17px;font-weight:800}.register{background:#2563eb;color:#fff}.register:disabled{opacity:.4}.cancel{background:#fee2e2;color:#b91c1c;margin-top:8px}
.message{display:none;padding:12px;margin-bottom:12px;border-radius:12px;font-size:14px;font-weight:700}.message.success{display:block;background:#dcfce7;color:#166534}.message.error{display:block;background:#fee2e2;color:#991b1b}
.loading{text-align:center;padding:28px;color:#64748b}
@media(max-width:480px){.app{padding-left:6px;padding-right:6px}.card{padding:11px 7px}.calendar,.weekdays{gap:3px}.day{min-height:100px;padding:5px 3px}.date-num{font-size:17px}}
</style>
</head>
<body><div class="app">
<div class="card"><h1>🌙 パシフィック 夜勤希望</h1><div class="sub">夜勤に入れる日と勤務時間を選んで登録してください。<br>同じ日に複数人登録できます。</div></div>
<div id="message" class="message"></div>
<div class="card">
<label for="staffSelect">あなたの名前</label><select id="staffSelect"><option value="">名前を選択してください</option></select>
<div class="field"><label for="shiftSelect">勤務時間</label><select id="shiftSelect"><option value="">勤務時間を選択してください</option></select></div>
</div>
<div class="card"><div class="month-nav"><button class="nav-btn" id="prevMonth">‹</button><div class="month-title" id="monthTitle"></div><button class="nav-btn" id="nextMonth">›</button></div>
<div class="weekdays"><div class="weekday sun">日</div><div class="weekday">月</div><div class="weekday">火</div><div class="weekday">水</div><div class="weekday">木</div><div class="weekday">金</div><div class="weekday sat">土</div></div>
<div id="calendar" class="calendar"><div class="loading">読み込み中...</div></div></div>
<div class="actions"><div id="selectedInfo" class="selected-info">名前と勤務時間を選択してください</div><button id="registerBtn" class="register" disabled>選択した日に夜勤できます</button><button id="cancelBtn" class="cancel" style="display:none">選択した自分の登録を取り消す</button></div>
</div>
<script>
const SUPABASE_URL="https://ujdexmngrwqixeirvoil.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqZGV4bW5ncndxaXhlaXJ2b2lsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NzAzNzIsImV4cCI6MjEwNTU0NjM3Mn0.aMJo_dwqnVmGL72jUCG0vJ7G4Q72fpJOPRsmhwjeC4M";
const SITE_SLUG="pacific";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentDate=new Date(); currentDate.setDate(1);
let staffs=[],shiftTypes=[],schedule={},holidays={},selectedDates=new Set();
const $=id=>document.getElementById(id),staffSelect=$("staffSelect"),shiftSelect=$("shiftSelect"),calendar=$("calendar"),monthTitle=$("monthTitle"),registerBtn=$("registerBtn"),cancelBtn=$("cancelBtn"),selectedInfo=$("selectedInfo"),message=$("message");
const dateKey=(y,m,d)=>`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
function showMessage(t,type="success"){message.className=`message ${type}`;message.textContent=t;window.scrollTo({top:0,behavior:"smooth"});setTimeout(()=>message.className="message",4500)}
async function loadHolidays(){try{const r=await fetch("https://holidays-jp.github.io/api/v1/date.json",{cache:"no-store"});if(!r.ok)throw Error(r.status);holidays=await r.json()}catch(e){holidays={}}}
async function loadConfig(){
 const {data,error}=await client.rpc("get_shift_app_config",{p_site_slug:SITE_SLUG}); if(error){showMessage("初期設定を取得できません："+error.message,"error");return}
 const sm=new Map(),tm=new Map(); (data||[]).forEach(r=>{sm.set(r.staff_id,{id:r.staff_id,name:r.staff_name,sort:r.staff_sort});tm.set(r.shift_type_id,{id:r.shift_type_id,code:r.shift_code,label:r.shift_label,sort:r.shift_sort})});
 staffs=[...sm.values()].sort((a,b)=>a.sort-b.sort); shiftTypes=[...tm.values()].sort((a,b)=>a.sort-b.sort);
 staffSelect.innerHTML='<option value="">名前を選択してください</option>'+staffs.map(x=>`<option value="${x.id}">${x.name}</option>`).join("");
 shiftSelect.innerHTML='<option value="">勤務時間を選択してください</option>'+shiftTypes.map(x=>`<option value="${x.id}">${x.label}</option>`).join("");
}
async function loadSchedule(){
 const y=currentDate.getFullYear(),m=currentDate.getMonth(),last=new Date(y,m+1,0).getDate();
 const {data,error}=await client.rpc("get_shift_availability",{p_site_slug:SITE_SLUG,p_start_date:dateKey(y,m,1),p_end_date:dateKey(y,m,last)});
 if(error){showMessage("勤務状況を取得できません："+error.message,"error");return}
 schedule={};(data||[]).forEach(r=>{(schedule[r.work_date]??=[]).push({staffId:r.staff_id,staffName:r.staff_name,shiftTypeId:r.shift_type_id,shiftLabel:r.shift_label})});renderCalendar()
}
function renderCalendar(){
 calendar.innerHTML="";const y=currentDate.getFullYear(),m=currentDate.getMonth();monthTitle.textContent=`${y}年 ${m+1}月`;
 const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++){const e=document.createElement("div");e.className="day empty";calendar.appendChild(e)}
 for(let d=1;d<=last;d++){const key=dateKey(y,m,d),wd=new Date(y,m,d).getDay(),assigned=schedule[key]||[],holiday=holidays[key]||"",past=key<todayKey(),sel=selectedDates.has(key),el=document.createElement("div");el.className="day"+(past?" past":"")+(assigned.length?" has":"")+(sel?" selected":"");
 let dc=wd===0||holiday?(holiday?"holiday-date":"sun-date"):wd===6?"sat-date":"";
 el.innerHTML=`<div class="date-num ${dc}">${d}</div><div class="count">${assigned.length}人登録</div>${assigned.map(p=>`<div class="person">${p.staffName}<small>${p.shiftLabel}</small></div>`).join("")}${sel?'<div class="mark">✓ 選択中</div>':""}`;
 if(!past)el.onclick=()=>handleDateTap(key);calendar.appendChild(el)} updateActionArea()
}
function handleDateTap(key){
 const sid=staffSelect.value;if(!sid){showMessage("先に自分の名前を選択してください。","error");return}
 const own=(schedule[key]||[]).find(p=>p.staffId===sid);if(own){selectedDates.clear();selectedDates.add(key);renderCalendar();return}
 selectedDates.has(key)?selectedDates.delete(key):selectedDates.add(key);renderCalendar()
}
function updateActionArea(){
 const sid=staffSelect.value,tid=shiftSelect.value,dates=[...selectedDates];
 if(!sid||!tid){selectedInfo.textContent="名前と勤務時間を選択してください";registerBtn.disabled=true;cancelBtn.style.display="none";return}
 if(!dates.length){selectedInfo.textContent="夜勤に入れる日を選択してください";registerBtn.disabled=true;cancelBtn.style.display="none";return}
 const own=dates.length===1&&(schedule[dates[0]]||[]).find(p=>p.staffId===sid);
 if(own){selectedInfo.textContent=`${dates[0]} ${own.shiftLabel} の登録を選択中`;registerBtn.disabled=true;cancelBtn.style.display="block"}
 else{selectedInfo.textContent=`${dates.length}日選択中・${shiftTypes.find(x=>x.id===tid)?.label||""}`;registerBtn.disabled=false;cancelBtn.style.display="none"}
}
staffSelect.onchange=()=>{selectedDates.clear();renderCalendar()};shiftSelect.onchange=updateActionArea;
registerBtn.onclick=async()=>{
 const sid=staffSelect.value,tid=shiftSelect.value,dates=[...selectedDates];if(!sid||!tid||!dates.length)return;
 registerBtn.disabled=true;registerBtn.textContent="登録中...";let ok=0,ng=0;
 for(const workDate of dates){const {error}=await client.rpc("register_shift_availability",{p_site_slug:SITE_SLUG,p_staff_id:sid,p_shift_type_id:tid,p_work_date:workDate});error?ng++:ok++}
 selectedDates.clear();await loadSchedule();registerBtn.textContent="選択した日に夜勤できます";showMessage(ng?`${ok}日登録、${ng}日は登録できませんでした。`:`${ok}日分を登録しました。`,ng?"error":"success")
};
cancelBtn.onclick=async()=>{
 const sid=staffSelect.value,dates=[...selectedDates];if(dates.length!==1)return;const workDate=dates[0];if(!confirm(`${workDate} の夜勤登録を取り消しますか？`))return;
 const {error}=await client.rpc("cancel_shift_availability",{p_site_slug:SITE_SLUG,p_staff_id:sid,p_work_date:workDate});if(error){showMessage("取り消せませんでした："+error.message,"error");return}
 selectedDates.clear();await loadSchedule();showMessage("夜勤登録を取り消しました。")
};
$("prevMonth").onclick=async()=>{currentDate.setMonth(currentDate.getMonth()-1);selectedDates.clear();await loadSchedule()};
$("nextMonth").onclick=async()=>{currentDate.setMonth(currentDate.getMonth()+1);selectedDates.clear();await loadSchedule()};
(async()=>{await loadHolidays();await loadConfig();await loadSchedule()})();
</script></body></html>
