<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>パシフィック 夜勤希望</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:#f5f7fb;
  color:#1f2937
}
.app{
  max-width:760px;
  margin:auto;
  padding:18px 12px 40px
}
.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  box-shadow:0 2px 16px rgba(0,0,0,.06);
  margin-bottom:14px
}
h1{
  font-size:24px;
  margin:0 0 6px
}
.sub{
  font-size:14px;
  color:#64748b;
  line-height:1.55
}
label{
  display:block;
  font-weight:800;
  margin:0 0 8px
}
select{
  width:100%;
  padding:14px;
  font-size:17px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  background:#fff
}
.field{
  margin-top:14px
}
.month-nav{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:14px
}
.month-title{
  font-size:24px;
  font-weight:800;
  text-align:center;
  flex:1
}
.nav-btn{
  border:0;
  background:#e2e8f0;
  color:#334155;
  border-radius:10px;
  padding:10px 14px;
  font-size:18px;
  cursor:pointer
}
.weekdays,.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px
}
.weekday{
  text-align:center;
  font-size:13px;
  font-weight:700;
  color:#64748b;
  padding-bottom:5px
}
.day{
  min-height:108px;
  border:1px solid #e2e8f0;
  border-radius:12px;
  background:#fff;
  padding:7px 5px;
  overflow:hidden;
  cursor:pointer;
  position:relative
}
.day.empty{
  border:0;
  background:transparent;
  cursor:default
}
.date-num{
  font-size:18px;
  font-weight:800;
  margin-bottom:4px
}
.sun .date-num,.holiday .date-num{
  color:#ef4444
}
.sat .date-num{
  color:#3b82f6
}
.count{
  font-size:11px;
  font-weight:800;
  border-radius:7px;
  padding:4px;
  background:#f1f5f9;
  margin-bottom:4px
}
.person{
  font-size:11px;
  line-height:1.25;
  padding:3px 4px;
  border-radius:7px;
  background:#eff6ff;
  margin-bottom:3px
}
.selected{
  outline:3px solid #2563eb;
  background:#eff6ff
}
.selected-info{
  text-align:center;
  font-size:14px;
  margin-top:10px;
  color:#334155
}
.actions{
  display:flex;
  gap:10px;
  margin-top:14px
}
button.register,button.cancel{
  width:100%;
  padding:15px;
  border:0;
  border-radius:13px;
  font-size:17px;
  font-weight:800;
  cursor:pointer
}
.register{
  background:#2563eb;
  color:#fff
}
.cancel{
  background:#e2e8f0;
  color:#334155
}
.message{
  display:none;
  padding:12px;
  margin-bottom:12px;
  border-radius:12px;
  font-size:14px;
  font-weight:700
}
.message.success{
  display:block;
  background:#dcfce7;
  color:#166534
}
.message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b
}
.loading{
  text-align:center;
  padding:28px;
  color:#64748b
}
@media(max-width:480px){
  .app{padding-left:6px;padding-right:6px}
  .card{padding:11px 7px}
  .calendar,.weekdays{gap:3px}
  .day{min-height:100px;padding:5px 3px}
  .date-num{font-size:17px}
}
</style>
</head>

<body>

<div class="app">

<div class="card">
  <h1>🌙 パシフィック 夜勤希望</h1>
  <div class="sub">
    希望する日と内容を選んで登録してください。<br>
    「19:00〜翌7:00」「22:00〜翌10:00」「有給」から選べます。
  </div>

  <div id="message" class="message"></div>

  <div class="field">
    <label for="staffSelect">名前</label>
    <select id="staffSelect">
      <option value="">名前を選択してください</option>
    </select>
  </div>

  <div class="field">
    <label for="shiftSelect">希望内容</label>
    <select id="shiftSelect">
      <option value="">希望内容を選択してください</option>
    </select>
  </div>
</div>

<div class="card">

  <div class="month-nav">
    <button class="nav-btn" id="prevMonth">‹</button>
    <div class="month-title" id="monthTitle"></div>
    <button class="nav-btn" id="nextMonth">›</button>
  </div>

  <div class="weekdays">
    <div class="weekday">日</div>
    <div class="weekday">月</div>
    <div class="weekday">火</div>
    <div class="weekday">水</div>
    <div class="weekday">木</div>
    <div class="weekday">金</div>
    <div class="weekday">土</div>
  </div>

  <div id="calendar" class="calendar">
    <div class="loading">読み込み中...</div>
  </div>

  <div id="selectedInfo" class="selected-info">
    日付を選択してください
  </div>

  <div class="actions">
    <button id="registerBtn" class="register">
      選択した内容を登録
    </button>
  </div>

  <div class="actions">
    <button id="cancelBtn" class="cancel">
      選択した日の登録を取消
    </button>
  </div>

</div>
</div>

<script>

const SUPABASE_URL =
  "https://ujdexmngrwqixeirvoil.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqZGV4bW5ncndxaXhlaXJ2b2lsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NzAzNzIsImV4cCI6MjEwNTU0NjM3Mn0.aMJo_dwqnVmGL72jUCG0vJ7G4Q72fpJOPRsmhwjeC4M";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const SITE_SLUG = "pacific";

let current = new Date();
current.setDate(1);

let selectedDates = new Set();
let availability = [];
let holidays = {};

const staffSelect =
  document.getElementById("staffSelect");

const shiftSelect =
  document.getElementById("shiftSelect");

const calendar =
  document.getElementById("calendar");

const monthTitle =
  document.getElementById("monthTitle");

const selectedInfo =
  document.getElementById("selectedInfo");

const message =
  document.getElementById("message");


function showMessage(text,type="success"){

  message.textContent=text;
  message.className="message "+type;

  setTimeout(()=>{
    message.className="message";
  },3500);

}


function dateString(y,m,d){

  return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

}


async function loadHolidays(){

  try{

    const r=await fetch(
      "https://holidays-jp.github.io/api/v1/date.json"
    );

    holidays=await r.json();

  }catch(e){

    holidays={};

  }

}


async function loadConfig(){

  const {data,error}=await db.rpc(
    "get_shift_app_config",
    {
      p_site_slug:SITE_SLUG
    }
  );

  if(error){

    showMessage(
      "設定を読み込めませんでした。",
      "error"
    );

    return;

  }

  const staffMap=new Map();
  const shiftMap=new Map();

  (data||[]).forEach(r=>{

    staffMap.set(
      r.staff_id,
      {
        id:r.staff_id,
        name:r.staff_name,
        sort:r.staff_sort
      }
    );

    shiftMap.set(
      r.shift_type_id,
      {
        id:r.shift_type_id,
        label:r.shift_label,
        sort:r.shift_sort
      }
    );

  });


  const staffs=[...staffMap.values()]
    .sort((a,b)=>a.sort-b.sort);

  const shifts=[...shiftMap.values()]
    .sort((a,b)=>a.sort-b.sort);


  staffSelect.innerHTML=
    '<option value="">名前を選択してください</option>'+
    staffs.map(s=>
      `<option value="${s.id}">${s.name}</option>`
    ).join("");


  shiftSelect.innerHTML=
    '<option value="">希望内容を選択してください</option>'+
    shifts.map(s=>
      `<option value="${s.id}">${s.label}</option>`
    ).join("");

}


async function loadAvailability(){

  const y=current.getFullYear();
  const m=current.getMonth()+1;

  const last=
    new Date(y,m,0).getDate();

  const start=
    dateString(y,m,1);

  const end=
    dateString(y,m,last);


  const {data,error}=await db.rpc(
    "get_shift_availability",
    {
      p_site_slug:SITE_SLUG,
      p_start_date:start,
      p_end_date:end
    }
  );


  if(error){

    showMessage(
      "登録状況を読み込めませんでした。",
      "error"
    );

    availability=[];

  }else{

    availability=data||[];

  }

}


function renderCalendar(){

  const y=current.getFullYear();
  const m=current.getMonth()+1;

  monthTitle.textContent=
    `${y}年${m}月`;


  const firstDay=
    new Date(y,m-1,1).getDay();

  const lastDay=
    new Date(y,m,0).getDate();


  let html="";


  for(let i=0;i<firstDay;i++){

    html+=
      '<div class="day empty"></div>';

  }


  for(let d=1;d<=lastDay;d++){

    const ds=
      dateString(y,m,d);

    const dow=
      new Date(y,m-1,d).getDay();

    const rows=
      availability.filter(
        x=>x.work_date===ds
      );

    const classes=["day"];

    if(dow===0) classes.push("sun");

    if(dow===6) classes.push("sat");

    if(holidays[ds])
      classes.push("holiday");

    if(selectedDates.has(ds))
      classes.push("selected");


    let people="";

    if(rows.length){

      people=
        `<div class="count">${rows.length}件</div>`+
        rows.map(r=>
          `<div class="person">
            ${r.staff_name}<br>
            ${r.shift_label}
          </div>`
        ).join("");

    }


    html+=`

      <div class="${classes.join(" ")}"
           data-date="${ds}">

        <div class="date-num">${d}</div>

        ${people}

      </div>

    `;

  }


  calendar.innerHTML=html;


  calendar
    .querySelectorAll(".day:not(.empty)")
    .forEach(el=>{

      el.addEventListener(
        "click",
        ()=>toggleDate(el.dataset.date)
      );

    });

}


function toggleDate(ds){

  if(selectedDates.has(ds)){

    selectedDates.delete(ds);

  }else{

    selectedDates.add(ds);

  }

  updateSelectedInfo();

  renderCalendar();

}


function updateSelectedInfo(){

  const dates=
    [...selectedDates].sort();

  if(!dates.length){

    selectedInfo.textContent=
      "日付を選択してください";

    return;

  }

  selectedInfo.textContent=
    `${dates.length}日選択中：`+
    dates.join("、");

}


async function refresh(){

  calendar.innerHTML=
    '<div class="loading">読み込み中...</div>';

  await loadAvailability();

  renderCalendar();

  updateSelectedInfo();

}


document
.getElementById("prevMonth")
.onclick=async()=>{

  current.setMonth(
    current.getMonth()-1
  );

  selectedDates.clear();

  await refresh();

};


document
.getElementById("nextMonth")
.onclick=async()=>{

  current.setMonth(
    current.getMonth()+1
  );

  selectedDates.clear();

  await refresh();

};


document
.getElementById("registerBtn")
.onclick=async()=>{

  const staffId=
    staffSelect.value;

  const shiftId=
    shiftSelect.value;

  const dates=
    [...selectedDates];


  if(!staffId || !shiftId){

    showMessage(
      "名前と希望内容を選択してください。",
      "error"
    );

    return;

  }


  if(!dates.length){

    showMessage(
      "日付を選択してください。",
      "error"
    );

    return;

  }


  for(const workDate of dates){

    const {error}=await db.rpc(
      "register_shift_availability",
      {
        p_site_slug:SITE_SLUG,
        p_staff_id:staffId,
        p_shift_type_id:shiftId,
        p_work_date:workDate
      }
    );


    if(error){

      showMessage(
        "登録できませんでした。",
        "error"
      );

      return;

    }

  }


  selectedDates.clear();

  showMessage(
    "登録しました。"
  );

  await refresh();

};


document
.getElementById("cancelBtn")
.onclick=async()=>{

  const staffId=
    staffSelect.value;

  const dates=
    [...selectedDates];


  if(!staffId){

    showMessage(
      "名前を選択してください。",
      "error"
    );

    return;

  }


  if(!dates.length){

    showMessage(
      "取消する日付を選択してください。",
      "error"
    );

    return;

  }


  if(!confirm(
    "選択した日の登録を取り消しますか？"
  )) return;


  for(const workDate of dates){

    const {error}=await db.rpc(
      "cancel_shift_availability",
      {
        p_site_slug:SITE_SLUG,
        p_staff_id:staffId,
        p_work_date:workDate
      }
    );


    if(error){

      showMessage(
        "取消できませんでした。",
        "error"
      );

      return;

    }

  }


  selectedDates.clear();

  showMessage(
    "登録を取り消しました。"
  );

  await refresh();

};


async function start(){

  await loadHolidays();

  await loadConfig();

  await refresh();

}


start();

</script>

</body>
</html>
